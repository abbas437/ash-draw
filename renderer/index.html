<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- script-src carries the SHA-256 of the inline import map below; recompute it if the map changes
     (printf '%s' '<map>' | openssl dgst -sha256 -binary | base64). -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'sha256-K7zyWt8e7VpluRWOGr76kWwYSgDsTQBnkm90OsVC1GM='; connect-src 'self' blob: data:; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ASH Draw Studio</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="styles.css">
<script type="importmap">{"imports":{"pdf-lib":"./vendor/pdf-lib.esm.js","@pdf-lib/fontkit":"./vendor/fontkit.esm.js","bidi-js":"./vendor/bidi.esm.js"}}</script>
<script src="shim.js"></script>
<script type="module" src="app.js"></script>
</head>
<body>
<div id="app">
  <header id="menubar"></header>
  <div id="main">
    <aside id="tools" aria-label="Tools"></aside>
    <section id="docs">
    <div id="tabbar" role="tablist" aria-label="Open drawings"></div>
    <section id="stage">
      <canvas id="cv" tabindex="0" aria-label="Drawing area"></canvas>
      <div id="zoombar"><button id="z-in" title="Zoom in">+</button><button id="z-out" title="Zoom out">−</button><button id="z-fit" title="Zoom to fit (Z, E)">Fit</button></div>
      <div id="stage-logo" aria-hidden="true"><img class="brand-logo lt" src="assets/brand/ash-logo-horizontal.svg" alt=""><img class="brand-logo rev" src="assets/brand/ash-logo-horizontal-reversed.svg" alt=""></div>
      <div id="toast" role="status"></div>
      <div id="drop">Drop a DWG or DXF file to open it</div>
    </section>
    </section>
    <aside id="side">
      <div class="panel" data-sec="layers"><div class="phead">Layers <span class="spacer"></span><button id="layer-cols" aria-pressed="false" title="Show or hide the Linetype, Lineweight and Transparency columns">Columns</button><button id="layer-states" title="Layer states: save and restore the layers' settings (LAYERSTATE)">States…</button><button id="layer-add" title="New layer">+</button><button id="layer-del" title="Delete current layer (must be empty)">−</button></div><div class="lay-search"><input id="layer-filter" type="search" placeholder="Filter layers" aria-label="Filter layers by name" spellcheck="false"><button id="layer-filter-clear" class="icon" title="Clear the filter" hidden>×</button></div><div id="layers"></div></div>
      <div class="panel" id="mk-panel" data-sec="markups"><div class="phead">Markups <span class="spacer"></span><select id="mk-filter" title="Show markups with this status"><option value="all">All</option><option value="Open">Open</option><option value="Closed">Closed</option></select><button id="mk-author">Author…</button><button id="mk-csv" title="Export the markup list as CSV">CSV</button></div><div class="mk-bar"><button id="mk-start" title="Number of the next new markup">Start no.…</button><button id="mk-renum" title="Renumber all markups in order (one undo step)">Renumber…</button><button id="mk-crs" title="Export the markups as a Comment Review Sheet (Excel)">Export to CRS (xlsx)…</button></div><div id="markups"></div></div>
      <div class="panel" id="sym-panel" data-sec="symbols"><div class="phead">Symbols <span class="spacer"></span><span class="sym-views" role="group" aria-label="Symbols layout"><button id="sym-view-grid" title="Show symbols as a grid" aria-label="Grid"></button><button id="sym-view-list" title="Show symbols as a list (fits a narrow panel)" aria-label="List"></button><button id="sym-view-float" title="Float the symbols in their own window" aria-label="Floating window"></button></span><button id="sym-float-close" title="Close: dock the symbols back in the side panel" aria-label="Close" hidden>×</button></div><div class="sym-row sym-src"><select id="sym-source" aria-label="Symbol source"></select><button id="sym-more" title="Symbol folders: add or remove" aria-label="Symbol folders" aria-haspopup="menu" aria-expanded="false">⋯</button><div id="sym-menu" class="popmenu" role="menu" hidden><button id="sym-add" role="menuitem" title="Add a folder of DXF/DWG symbols">Add folder…</button><button id="sym-remove" role="menuitem" title="Remove this folder from the list (the files stay)">Remove folder</button></div></div><div class="sym-row"><select id="sym-cat" aria-label="Category"></select><input id="sym-search" type="search" placeholder="Search symbols" aria-label="Search symbols by name" spellcheck="false"></div><div id="sym-grid" role="list" aria-label="Symbols"></div><div class="sym-row sym-scales"><label>Symbol scale <input id="sym-scale" type="text" inputmode="decimal" title="Overall scale applied to every inserted symbol"></label><label>Drawing scale 1:<input id="sym-dscale" type="text" inputmode="decimal" title="Paper-size symbols (devices) are enlarged by N so they print at their size on a 1:N sheet"></label><button id="sym-count" title="Count the symbols in the selection or the current space (SYMCOUNT)">Count…</button></div><div id="sym-status" role="status"></div></div>
      <div class="panel" data-sec="props"><div id="props"></div></div>
    </aside>
  </div>
  <footer id="cmdbar"><span id="prompt"></span><input id="cmd" type="text" autocomplete="off" spellcheck="false" placeholder="Type a command (L, PL, C, M, CO, RO, TR …) or coordinates (x,y  @dx,dy  d&lt;angle)"></footer>
  <div id="status"></div>
</div>
<dialog id="dlg"></dialog>
</body>
</html>
