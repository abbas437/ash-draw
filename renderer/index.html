<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- script-src carries the SHA-256 of the inline import map below; recompute it if the map changes
     (printf '%s' '<map>' | openssl dgst -sha256 -binary | base64). -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'sha256-grgUmfIrH5NOwtJD5i9fm+LSAqSopgXV6au9JSD26Vo='; connect-src 'self' blob: data:; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ASH Draw Studio</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="styles.css">
<script type="importmap">{"imports":{"pdf-lib":"./vendor/pdf-lib.esm.js","@pdf-lib/fontkit":"./vendor/fontkit.esm.js"}}</script>
<script src="shim.js"></script>
<script type="module" src="app.js"></script>
</head>
<body>
<div id="app">
  <header id="menubar"></header>
  <div id="main">
    <aside id="tools" aria-label="Tools"></aside>
    <section id="docs">
    <div id="tabbar" role="tablist" aria-label="Open drawings"></div>
    <section id="stage">
      <canvas id="cv" tabindex="0" aria-label="Drawing area"></canvas>
      <div id="zoombar"><button id="z-in" title="Zoom in">+</button><button id="z-out" title="Zoom out">−</button><button id="z-fit" title="Zoom to fit (Z, E)">Fit</button></div>
      <div id="stage-logo" aria-hidden="true"><img class="brand-logo lt" src="assets/brand/ash-logo-horizontal.svg" alt=""><img class="brand-logo rev" src="assets/brand/ash-logo-horizontal-reversed.svg" alt=""></div>
      <div id="toast" role="status"></div>
      <div id="drop">Drop a DWG or DXF file to open it</div>
    </section>
    </section>
    <aside id="side">
      <div class="panel"><div class="phead">Layers <span class="spacer"></span><button id="layer-add" title="New layer">+</button><button id="layer-del" title="Delete current layer (must be empty)">−</button></div><div id="layers"></div></div>
      <div class="panel"><div id="props"></div></div>
    </aside>
  </div>
  <footer id="cmdbar"><span id="prompt"></span><input id="cmd" type="text" autocomplete="off" spellcheck="false" placeholder="Type a command (L, PL, C, M, CO, RO, TR …) or coordinates (x,y  @dx,dy  d&lt;angle)"></footer>
  <div id="status"></div>
</div>
<dialog id="dlg"></dialog>
</body>
</html>
