name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Publish a GitHub Release with this tag, e.g. v0.1.0 (leave empty to only build)'
        required: false
        default: ''
      prerelease:
        description: 'Mark the release as a pre-release (test build)'
        type: boolean
        required: false
        default: false

jobs:
  libredwg-win64:
    # Patched LibreDWG converters: the upstream 0.14.8597 Windows binaries misread drawings whose
    # decompressed data passes 256 MiB (32-bit long in src/bits.c on Windows). Cross-build the pinned
    # upstream source + tools/libredwg-win/libredwg-llp64-bitpos.patch with mingw-w64 and hand the
    # zip to the windows job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache the patched build (keyed on patch, build scripts and pins)
        id: cache
        uses: actions/cache@v4
        with:
          path: .cache/libredwg-llp64
          key: libredwg-llp64-${{ runner.os }}-${{ env.ImageOS }}-${{ env.ImageVersion }}-${{ hashFiles('tools/libredwg-win/**', 'scripts/fetch-libredwg.mjs', '.github/workflows/build.yml') }}
      - name: Install mingw-w64
        if: steps.cache.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mingw-w64 zip unzip xz-utils patch
      - name: Download + SHA-256-verify the upstream source tarball and win64 zip (pinned)
        if: steps.cache.outputs.cache-hit != 'true'
        run: node scripts/fetch-libredwg.mjs --source .cache/libredwg-src
      - name: Patch, cross-build and package
        if: steps.cache.outputs.cache-hit != 'true'
        run: >-
          sh tools/libredwg-win/build-patched.sh
          .cache/libredwg-src/libredwg-0.14.8597.tar.xz
          .cache/libredwg-0.14.8597-win64.zip
          .cache/libredwg-build
          .cache/libredwg-llp64
      - name: Verify the patched zip (patch matches, dwg2dxf/dxf2dwg/libredwg-0/libiconv-2 present)
        run: node scripts/fetch-libredwg.mjs --from .cache/libredwg-llp64/libredwg-0.14.8597-llp64-win64.zip --require-patched
      - uses: actions/upload-artifact@v4
        with:
          name: libredwg-llp64-win64
          path: |
            .cache/libredwg-llp64/libredwg-0.14.8597-llp64-win64.zip
            .cache/libredwg-llp64/libredwg-0.14.8597-llp64-win64.zip.sha256
          if-no-files-found: error

  windows:
    needs: libredwg-win64
    runs-on: windows-latest
    permissions:
      contents: write   # needed only by the tag-build release step
    env:
      # fetch-libredwg.mjs (also run by `npm run dist`) takes the patched converters from here.
      ASH_LIBREDWG_ZIP: ${{ github.workspace }}/.cache/libredwg-llp64/libredwg-0.14.8597-llp64-win64.zip
      # Fail the build rather than ship the upstream (256 MiB-buggy) binaries.
      ASH_LIBREDWG_REQUIRE_PATCHED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: libredwg-llp64-win64
          path: .cache/libredwg-llp64
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run licenses
      # Verify + extract the patched LibreDWG converters first so the DWG round-trip tests run on the shipped Windows binaries.
      - run: npm run fetch:libredwg -- --require-patched
      - name: npm test
        shell: bash
        env:
          ASH_LIBREDWG_DIR: ${{ github.workspace }}/build/libredwg
        run: |
          set +e
          npm test > test-out.txt 2>&1
          code=$?
          cat test-out.txt
          if [ $code -ne 0 ]; then
            msg=$( (grep -n -A 30 '^not ok\|^    not ok' test-out.txt | head -c 3000; tail -c 400 test-out.txt) | tr -d '\r' | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
            echo "::error title=npm test failed::$msg"
          fi
          exit $code
      - name: electron bridge tests
        shell: bash
        run: |
          set +e
          node --test "electron/**/*.test.mjs" > bridge-out.txt 2>&1
          code=$?
          cat bridge-out.txt
          if [ $code -ne 0 ]; then
            msg=$(tail -c 3500 bridge-out.txt | tr -d '\r' | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
            echo "::error title=bridge tests failed::$msg"
            # the failing tests themselves (the tail above usually shows only the summary)
            fails=$(tr -d '\r' < bridge-out.txt | awk '/^not ok /{n=40} n>0{print; n--}' | head -c 3500 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
            [ -n "$fails" ] && echo "::error title=failing bridge tests::$fails"
          fi
          exit $code
      - name: Version from the release tag (so each test build has its own file names and About version)
        if: (github.event_name == 'workflow_dispatch' && inputs.release_version != '') || startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          VERSION: ${{ inputs.release_version || github.ref_name }}
        run: npm version "${VERSION#v}" --no-git-tag-version --allow-same-version
      - name: Build installer and portable exe
        shell: bash
        run: |
          set +e
          npm run dist > dist-out.txt 2>&1
          code=$?
          cat dist-out.txt
          if [ $code -ne 0 ]; then
            msg=$(tail -c 3500 dist-out.txt | tr -d '\r' | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
            echo "::error title=electron-builder failed::$msg"
          fi
          exit $code
      - name: Assert the shipped LibreDWG converters are the patched build
        shell: bash
        run: test -f build/libredwg/libredwg-llp64-bitpos.patch
      - name: LibreDWG corresponding source (GPL) for the release - tarball, patch, build scripts
        shell: bash
        run: |
          node scripts/fetch-libredwg.mjs --source dist/
          tar -czf dist/libredwg-0.14.8597-win64-build-tools.tar.gz tools/libredwg-win
      - name: SHA256SUMS.txt
        shell: bash
        working-directory: dist
        run: |
          shopt -s nullglob
          files=(ASH-Draw-Studio-Setup-*.exe ASH-Draw-Studio-Portable-*.exe ASH-Draw-Studio-*-win-x64.zip)
          if [ "${#files[@]}" -ne 3 ]; then echo "expected 3 files (Setup, Portable, zip), found ${#files[@]}"; exit 1; fi
          sha256sum "${files[@]}" | sed 's/ \*/  /' > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ASH-Draw-Studio-windows-x64
          path: |
            dist/ASH-Draw-Studio-Setup-*.exe
            dist/ASH-Draw-Studio-Portable-*.exe
            dist/ASH-Draw-Studio-*-win-x64.zip
            dist/SHA256SUMS.txt
            dist/libredwg-*.tar.xz
            dist/libredwg-*.patch
            dist/libredwg-*-build-tools.tar.gz
          if-no-files-found: error
      - name: GitHub Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/ASH-Draw-Studio-Setup-*.exe \
            dist/ASH-Draw-Studio-Portable-*.exe \
            dist/ASH-Draw-Studio-*-win-x64.zip \
            dist/SHA256SUMS.txt \
            dist/libredwg-*.tar.xz \
            dist/libredwg-*.patch \
            dist/libredwg-*-build-tools.tar.gz \
            --title "ASH Draw Studio $GITHUB_REF_NAME" \
            --generate-notes
      - name: GitHub Release (manual run with a version)
        if: github.event_name == 'workflow_dispatch' && inputs.release_version != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.release_version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          PRE=""; if [ "$PRERELEASE" = "true" ]; then PRE="--prerelease"; fi
          gh release create "$VERSION" --target "$GITHUB_SHA" $PRE \
            dist/ASH-Draw-Studio-Setup-*.exe \
            dist/ASH-Draw-Studio-Portable-*.exe \
            dist/ASH-Draw-Studio-*-win-x64.zip \
            dist/SHA256SUMS.txt \
            dist/libredwg-*.tar.xz \
            dist/libredwg-*.patch \
            dist/libredwg-*-build-tools.tar.gz \
            --title "ASH Draw Studio $VERSION" \
            --generate-notes

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: pip install ezdxf
      - run: npm ci && npm run vendor && npm test

  tidy:
    # after a manual pre-release build, retitle the older test builds as superseded
    needs: windows
    if: github.event_name == 'workflow_dispatch' && inputs.release_version != '' && inputs.prerelease
    permissions:
      contents: write
    uses: ./.github/workflows/tidy-releases.yml
